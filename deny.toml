# cargo-deny: what may be in the dependency tree of the framework's crates
# (docs/SECURITY.md, "Build hardening and supply chain"). CI runs
# `cargo deny check` on every change to the dependencies and every week
# (.github/workflows/security.yml), for this workspace and for the template
# (`--manifest-path template/Cargo.toml`, which uses the same file); locally:
#   cargo install --locked cargo-deny && cargo deny check
#   cargo deny --manifest-path template/Cargo.toml check

[graph]
# Telamon OS images are x86_64 and aarch64 Fedora; crates only for other
# systems are not looked at.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[advisories]
version = 2
# A known vulnerability, an unmaintained crate or a yanked version in the lock
# file fails the check. Ignore an advisory only with the reason and a date to
# look at it again, in `ignore = [{ id = "RUSTSEC-...", reason = "..." }]`.
yanked = "deny"
unmaintained = "all"
ignore = []

[licenses]
version = 2
# The framework is MIT; these are the licences its dependencies come under.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Two versions of one crate are common in a tree this size (zbus, cxx-qt and
# their dependencies); they are listed, not refused.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
    # Apps link the system's TLS stack through nothing of the framework's: the
    # crash sender speaks https through the system's curl or its own client
    # (see docs/SECURITY.md, "Crash reports"); a second TLS library in the tree
    # would be a surprise worth a review.
    { crate = "openssl", reason = "TLS is not done in Rust here; a library in the tree is new attack surface" },
    { crate = "openssl-sys", reason = "see openssl" },
    { crate = "native-tls", reason = "see openssl" },
]

[sources]
# crates.io only. The framework has no git dependency; an app that takes the
# framework from git lists the framework's repository in its own deny.toml.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
