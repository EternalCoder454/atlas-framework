# The Rust side of telamon-framework. Apps take only the crates they need, so a
# small app (Telamon Notepad) stays light:
#   telamon-framework-core     every app: app identity, settings, logging, os-release
#   telamon-framework-ui       every app with a window: startup, app ID, crash hooks
#   telamon-framework-system   system apps: crash reports, Telamon OS state, polkit
#   telamon-framework-flatpak  Telamon Updater and Telamon Store: libflatpak
[workspace]
resolver = "3"
members = ["crates/*"]
# The template builds on its own, as a copied app would.
exclude = ["template"]

[workspace.package]
version = "2.0.7"
edition = "2024"
license = "MIT"
repository = "https://github.com/EternalCoder454/atlas-framework"
rust-version = "1.89"

[workspace.dependencies]
telamon-framework-core = { path = "crates/telamon-framework-core", version = "2.0.7" }
telamon-framework-system = { path = "crates/telamon-framework-system", version = "2.0.7" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
libc = "0.2.190"
log = { version = "0.4.34", features = ["std"] }
tempfile = "3.27.0"
