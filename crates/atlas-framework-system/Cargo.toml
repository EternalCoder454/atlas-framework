[package]
name = "atlas-framework-system"
description = "For Atlas system apps: crash reports, AtlasOS state (bootc, history, events), polkit checks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# polkit checks for a root D-Bus helper (pulls in zbus)
polkit = ["dep:zbus", "dep:tokio"]

[dependencies]
atlas-framework-core.workspace = true
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
getrandom = "0.3"
# NFC before name matching, so a decomposed "ë" still matches "ë"
unicode-normalization = "0.1"
zbus = { version = "5", default-features = false, features = ["tokio"], optional = true }
tokio = { version = "1", features = ["time"], optional = true }

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1", features = ["rt", "macros"] }
