[package]
name = "telamon-framework-system"
description = "For Telamon system apps: crash reports, Telamon OS state (bootc, history, events), polkit checks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# polkit checks for a root D-Bus helper (pulls in zbus)
polkit = ["dep:zbus", "dep:tokio"]
# desktop notifications over org.freedesktop.Notifications (zbus, tokio)
notify = ["dep:zbus", "dep:tokio"]

[dependencies]
telamon-framework-core.workspace = true
serde.workspace = true
log.workspace = true
serde_json.workspace = true
libc.workspace = true
getrandom = "0.3.4"
# NFC before name matching, so a decomposed "ë" still matches "ë"
unicode-normalization = "0.1.25"
zbus = { version = "5.19.0", default-features = false, features = ["tokio"], optional = true }
tokio = { version = "1.53.2", features = ["rt", "time", "macros"], optional = true }

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
tokio = { version = "1.53.2", features = ["rt", "macros"] }
