# Pull requests that move the pinned GitHub Actions (each by commit sha, with
# its version in a comment) and the crates' dependencies. docs/SECURITY.md,
# "Build hardening and supply chain".
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /template
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: "ci"
  - package-ecosystem: cargo
    directories:
      - /
      - /template
    schedule:
      interval: weekly
    groups:
      crates:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"
