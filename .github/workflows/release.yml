name: Release

# Pushing a tag vX.Y.Z publishes a release of telamon-framework and opens a pull
# request in every Telamon app (tools/apps.txt) that moves it to the new tag,
# except for a release that raises the major version: 2.0.0 renamed every
# crate, so the apps move by hand (tools/migrate-app-to-telamon.sh) and the
# jobs that open pull requests are skipped (the release job says so).
#
# A release is made only from a commit on main whose CI run passed, and only
# when CHANGELOG.md has a finished section for the version. A tag must be
# newer than every other release, so re-running an older tag's workflow fails
# once a newer release exists.
#
# The pull requests need a token that can push branches and open pull
# requests in the app repositories: a fine-grained personal access token with
# Contents and Pull requests (read and write) on those repositories. Keep it
# as the secret APP_UPDATE_TOKEN of the environment "release" (Settings,
# Environments), with a required reviewer and a deployment rule for v* tags,
# and protect v* tags with a ruleset, so a pushed tag alone cannot reach it.
# The checks below are part of the tagged commit, so they stop mistakes, not
# someone who can push: the reviewer approves only a tag whose commit is on
# main (the deployment rule matches the tag's name, not its commit).
# Without the secret the release is still made and the update step says it
# was skipped.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      major_changed: ${{ steps.version.outputs.major_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # First, before the hour-long CI wait, so a mistyped tag fails at once.
      - name: The tag is vX.Y.Z, matches every version in the tree and is the newest
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v=${TAG#v}
          if ! [[ $v =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG is not vX.Y.Z"; exit 1
          fi
          cmake=$(sed -nE 's/^project\(telamon-framework VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          spec=$(sed -nE 's/^Version:[[:space:]]+([0-9.]+)$/\1/p' packaging/telamon-framework.spec)
          cargo=$(sed -nE '/^\[workspace.package\]/,/^\[/ s/^version = "([0-9.]+)"$/\1/p' Cargo.toml)
          bad=0
          for pair in "CMakeLists.txt:$cmake" "telamon-framework.spec:$spec" "Cargo.toml:$cargo"; do
            if [ "${pair#*:}" != "$v" ]; then
              echo "::error::${pair%%:*} says ${pair#*:}, the tag says $v"; bad=1
            fi
          done
          [ $bad = 0 ] || exit 1
          # Newer than every other release, so the app pull requests never
          # move an app back (a mistyped tag like v1.4.0 after v1.5.0).
          newest=$(git tag --list 'v*' | grep -vxF "$TAG" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          if [ -n "$newest" ] && [ "$(printf '%s\n%s\n' "${newest#v}" "$v" | sort -V | tail -n1)" != "$v" ]; then
            echo "::error::$TAG is not newer than $newest"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # A new major version may rename or remove what apps use (2.0.0 renamed
          # every crate): no pull request is opened in the apps for it, they are
          # moved by hand. The previous release is the newest other tag, or none.
          major_changed=false
          if [ -n "$newest" ] && [ "$(cut -d. -f1 <<<"${newest#v}")" != "${v%%.*}" ]; then
            major_changed=true
            echo "::notice::$TAG changes the major version ($newest before it): no pull requests will be opened in the apps; move them by hand (tools/migrate-app-to-telamon.sh for 2.0.0)"
          fi
          echo "major_changed=$major_changed" >> "$GITHUB_OUTPUT"

      - name: The tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the tagged commit is not on main"; exit 1
          fi

      - name: CI passed for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Any push run of this commit counts: the one for main can be cancelled
          # by a later push to main, but the tag push starts its own. Only push
          # runs: they use the commit's own ci.yml, which is on main. Waits up to
          # an hour; a failed query is retried.
          for _ in $(seq 120); do
            if ! runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
                          --event push --json status,conclusion); then
              echo "::warning::could not list CI runs, trying again"; sleep 30; continue
            fi
            if [ "$(jq '[.[] | select(.conclusion == "success")] | length' <<<"$runs")" -gt 0 ]; then
              echo "CI passed"; exit 0
            fi
            if [ "$(jq 'length' <<<"$runs")" -gt 0 ] && [ "$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")" = 0 ]; then
              echo "::error::no CI run passed for $GITHUB_SHA ($(jq -r '[.[].conclusion] | join(", ")' <<<"$runs")): fix or re-run CI, then re-run this workflow"; exit 1
            fi
            sleep 30
          done
          echo "::error::no finished CI run for $GITHUB_SHA after an hour"; exit 1

      - name: Still the newest release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Another tag pushed while CI ran (two close together) is known only
          # now; the older of the two must not release. Public repo, no auth.
          fetched=0
          for wait in 5 15 45 0; do
            if git fetch --tags --force origin; then fetched=1; break; fi
            [ "$wait" = 0 ] || { echo "::warning::git fetch failed, trying again in ${wait}s"; sleep "$wait"; }
          done
          if [ "$fetched" != 1 ]; then
            echo "::error::could not fetch the tags after 4 tries: cannot tell whether $TAG is the newest release; re-run this workflow"; exit 1
          fi
          v=${TAG#v}
          newest=$(git tag --list 'v*' | grep -vxF "$TAG" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          if [ -n "$newest" ] && [ "$(printf '%s\n%s\n' "${newest#v}" "$v" | sort -V | tail -n1)" != "$v" ]; then
            echo "::error::$TAG is not newer than $newest"; exit 1
          fi

      - name: Release notes from CHANGELOG.md
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          # The section under "## X.Y.Z", up to the next "## ".
          heading=$(grep -m1 -E "^## ${V//./\\.}( |$)" CHANGELOG.md || true)
          if [ -z "$heading" ]; then
            echo "::error::CHANGELOG.md has no section for $V"; exit 1
          fi
          if grep -qi 'unreleased' <<<"$heading"; then
            echo "::error::CHANGELOG.md still calls $V unreleased: change its heading to \"## $V\""; exit 1
          fi
          awk -v h="$heading" '$0 == h {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::the CHANGELOG.md section for $V is empty"; exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A re-run (the way to retry the app pull requests: "Re-run all jobs",
          # since each attempt's lock jobs make their own artifacts) finds the
          # release made.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$TAG is already released"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Telamon framework $TAG" --notes-file notes.md
          fi

  # The app pull requests, in two steps per app, because an app's checkout is
  # not trusted (cargo runs what its .cargo/config.toml names) and the token
  # can push to every app. update-locks runs `cargo update` with no secret and
  # hands back only Cargo.lock files; update-apps has the token, runs nothing
  # from the app, checks those files and builds the commit from git objects.
  # See tools/open-update-pr.sh.
  apps:
    needs: release
    # Skipped (with the two jobs below) when the major version changed.
    if: needs.release.outputs.major_changed != 'true'
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List the apps
        id: list
        run: |
          apps=$(grep -vE '^[[:space:]]*(#|$)' tools/apps.txt | jq -Rnc '[inputs]')
          if ! jq -e 'all(test("^[A-Za-z0-9_-][A-Za-z0-9._-]*$"))' <<<"$apps" >/dev/null; then
            echo "::error::tools/apps.txt has a name that is not a repository name"; exit 1
          fi
          # A repository with no commits yet (a new app) has nothing to update:
          # leave it out, or its failed lock job would hold back every app's
          # pull request. One that can't be reached at all still fails.
          kept='[]'
          for app in $(jq -r '.[]' <<<"$apps"); do
            rc=0
            GIT_TERMINAL_PROMPT=0 timeout 60 git ls-remote --exit-code "https://github.com/EternalCoder454/$app.git" HEAD >/dev/null || rc=$?
            case $rc in
              0) kept=$(jq -c --arg a "$app" '. + [$a]' <<<"$kept") ;;
              2) echo "::notice::$app has no commits yet: no pull request for it" ;;
              *) echo "::error::could not reach EternalCoder454/$app (git ls-remote exit $rc)"; exit 1 ;;
            esac
          done
          echo "apps=$kept" >> "$GITHUB_OUTPUT"

  update-locks:
    needs: [release, apps]
    if: needs.release.outputs.major_changed != 'true' && needs.apps.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.apps.outputs.apps) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Update the lock files
        env:
          APP: ${{ matrix.app }}
          V: ${{ needs.release.outputs.version }}
        run: tools/open-update-pr.sh lock "EternalCoder454/$APP" "v$V" "$RUNNER_TEMP/lock"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lock-${{ matrix.app }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lock
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  update-apps:
    needs: [release, apps, update-locks]
    # Only when every lock job passed: a failed one can mean another job
    # uploaded its artifact first.
    if: needs.release.outputs.major_changed != 'true' && needs.apps.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.apps.outputs.apps) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lock-${{ matrix.app }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lock

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.APP_UPDATE_TOKEN }}
          APP: ${{ matrix.app }}
          V: ${{ needs.release.outputs.version }}
          FRAMEWORK_COMMIT: ${{ github.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::APP_UPDATE_TOKEN is not set: no pull request opened for $APP"
            exit 0
          fi
          tools/open-update-pr.sh publish "EternalCoder454/$APP" "v$V" "telamon-framework-v$V" "$RUNNER_TEMP/lock"
