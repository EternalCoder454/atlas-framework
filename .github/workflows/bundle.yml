name: Telamon native app bundle

# Reusable: builds a Telamon app against the framework's Telamon.Ui in
# fedora:44, packs it as a native bundle (docs/BUNDLES.md: the
# <id>-<version>-x86_64.tar.zst and its telamon-bundle.json) and, for a v* tag,
# attaches both files to that tag's GitHub release, where Telamon Store finds
# them. The app's repository calls it from a tag; docs/BUNDLES.md ("Connecting
# an app") has the caller's file. The caller must grant `contents: write` to
# the job that calls this workflow.
#
# Three jobs, each with the least it needs:
#   bundle  runs the APP's build (arbitrary code): read-only token, no secrets.
#   sign    runs only the framework's own tools, on the artifact `bundle` made:
#           it re-verifies the bundle, then signs telamon-bundle.json with the
#           optional minisign-key secret. Telamon Store offers only releases
#           with a valid signature, so an app that wants its release used
#           either passes the secret or signs by hand. A release without a
#           signature stays a draft (allow-unsigned: true publishes it anyway),
#           and so does any release with publish: false. docs/BUNDLES.md, "Signing".
#   attach  runs nothing but gh, on files whose hashes it checks: the only job
#           that can write.
on:
  workflow_call:
    inputs:
      framework-ref:
        description: Full 40-character commit sha of telamon-framework (a branch, a tag or a short sha is refused); its tools pack the bundle and its sources are built as the telamon-ui the app compiles against
        type: string
        required: true
      app-dir:
        description: The app's CMake source directory, such as apps/telamon-gates (default - the only apps/*/CMakeLists.txt, else the repository root)
        type: string
        default: ''
      spec:
        description: The app's RPM spec, whose BuildRequires are installed and whose `telamon-ui >=` becomes min_telamon_ui (default - the only packaging/*.spec)
        type: string
        default: ''
      attach:
        description: Attach the bundle to the GitHub release of a v* tag (the bundle is always uploaded as a workflow artifact)
        type: boolean
        default: true
      publish:
        description: Publish a release this run made (true), or leave it a draft (false) so its owner can sign telamon-bundle.json offline and publish it by hand. A release without a signature is left a draft whatever this says, unless allow-unsigned is true
        type: boolean
        default: true
      allow-unsigned:
        description: Publish a release that has no signature (no minisign-key secret) as a normal release. Telamon Store will not offer it. The default is to leave it a draft, so a missing or misspelled secret cannot publish an unsigned release
        type: boolean
        default: false
      minisign-public-key:
        description: The minisign public key the catalog pins for this app (RW and 54 more characters); when given, the signature made with the minisign-key secret must verify with it, so a wrong key fails the run and not the users
        type: string
        default: ''
    secrets:
      minisign-key:
        description: The content of the minisign secret key file (both lines) that signs telamon-bundle.json; without it the release is attached unsigned, which Telamon Store will not offer. Anyone who can change the app's workflow or build can use this key; for an app with several writers sign offline (publish false) instead
        required: false
      minisign-password:
        description: The password of the minisign-key, if it has one
        required: false

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: registry.fedoraproject.org/fedora:44
    # Read-only: the app's build runs no code with a write token.
    permissions:
      contents: read
    env:
      FRAMEWORK_REF: ${{ inputs.framework-ref }}
      APP_DIR: ${{ inputs.app-dir }}
      SPEC: ${{ inputs.spec }}
    steps:
      - name: Tools for checkout, cache and the bundle
        run: dnf -y install git-core tar zstd gawk diffutils gh cmake ninja-build python3 gcc-c++ dnf5-plugins

      - name: Check the inputs
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          for pair in "app-dir:$APP_DIR" "spec:$SPEC"; do
            if ! [[ ${pair#*:} =~ ^[A-Za-z0-9._/-]*$ ]] || [[ /${pair#*:}/ == *"/../"* ]] || [[ ${pair#*:} == /* ]] || [[ ${pair#*:} == -* ]]; then
              echo "::error::${pair%%:*} must be a path inside the repository: letters, digits, . _ - and /, not starting with -"; exit 1
            fi
          done
          # A tag is data: it names the release and the version, and is only ever used
          # quoted, from the environment; a name like v1.0.0$(id) stops here.
          if [ "$REF_TYPE" = tag ] && [[ $REF_NAME == v* ]] && ! [[ $REF_NAME =~ ^v[0-9]+(\.[0-9]+)+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::the tag $(printf '%q' "$REF_NAME") is not vX.Y.Z or vX.Y.Z-prerelease (digits, letters, . and -)"; exit 1
          fi
          if ! [[ $FRAMEWORK_REF =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::framework-ref must be the full 40-character commit sha of a telamon-framework release (it is '$FRAMEWORK_REF'): a branch or tag names something that moves"; exit 1
          fi

      - name: Check out the app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the framework
        id: framework
        run: |
          # Outside the workspace. The same fetch as app-checks.yml.
          dir="$RUNNER_TEMP/telamon-framework"
          git init -q "$dir"
          git -C "$dir" fetch -q --depth 1 -- https://github.com/EternalCoder454/atlas-framework "$FRAMEWORK_REF"
          git -C "$dir" checkout -q FETCH_HEAD
          if [ "$(git -C "$dir" rev-parse HEAD)" != "$FRAMEWORK_REF" ]; then
            echo "::error::fetched $(git -C "$dir" rev-parse HEAD), not $FRAMEWORK_REF"; exit 1
          fi
          if [ ! -x "$dir/tools/make-bundle.sh" ]; then
            echo "::error::framework-ref has no tools/make-bundle.sh: use a commit from 2.0.4 on"; exit 1
          fi
          {
            echo "dir=$dir"
            echo "sha=$(git -C "$dir" rev-parse HEAD)"
            echo "month=$(date -u +%Y-%m)"
          } >> "$GITHUB_OUTPUT"

      # The telamon-ui the app is built against is built from the framework
      # commit, as the Store's CI does it, and cached: by commit and month (a
      # month later it is rebuilt on fresh Fedora packages), outside the
      # checkout, which actions/checkout would empty. A cache written by a tag
      # run is read only by that tag: run the caller by hand on the default
      # branch (workflow_dispatch) to seed one every tag can read.
      - name: Restore the telamon-ui RPMs
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /telamon-framework-rpms
          key: telamon-framework-rpms-f44-${{ steps.framework.outputs.sha }}-${{ steps.framework.outputs.month }}

      - name: Build the telamon-ui RPMs
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          FRAMEWORK_DIR: ${{ steps.framework.outputs.dir }}
        run: |
          "$FRAMEWORK_DIR/packaging/build-rpm.sh" /telamon-framework-rpms
          cd /telamon-framework-rpms && sha256sum -- *.rpm > SHA256SUMS

      # Saved here, before any of the app's code runs (the spec's macros and
      # the app's CMake can run commands): a cache entry holds only what the
      # framework's own build made.
      - name: Save the telamon-ui RPMs
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /telamon-framework-rpms
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Check the cached RPMs
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          cd /telamon-framework-rpms
          sha256sum --strict -c SHA256SUMS
          # Nothing unlisted is installed either.
          diff <(ls -1 -- *.rpm) <(awk '{print $2}' SHA256SUMS | sort)

      - name: Install telamon-ui and the app's build dependencies
        run: |
          dnf -y install /telamon-framework-rpms/telamon-ui-[0-9]*.rpm /telamon-framework-rpms/telamon-symbols-fonts-[0-9]*.rpm
          shopt -s nullglob
          specs=(packaging/*.spec)
          [ -z "$SPEC" ] || specs=("$SPEC")
          if [ ${#specs[@]} -ne 1 ]; then
            echo "::error::cannot tell which spec lists the build dependencies (${#specs[@]} packaging/*.spec): set the spec input"; exit 1
          fi
          dnf -y builddep "${specs[0]}"
          rpm -q telamon-ui

      - name: Build and pack the bundle
        env:
          FRAMEWORK_DIR: ${{ steps.framework.outputs.dir }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          args=(--out bundle-out)
          [ -z "$APP_DIR" ] || args+=(--app-dir "$APP_DIR")
          [ -z "$SPEC" ] || args+=(--spec "$SPEC")
          # A v* tag is the version: it must agree with CMake's project VERSION.
          if [ "$REF_TYPE" = tag ] && [[ $REF_NAME == v* ]]; then
            args+=(--version "${REF_NAME#v}")
          fi
          "$FRAMEWORK_DIR/tools/make-bundle.sh" "${args[@]}"
          # The release tag is v<version>, with the manifest's version.
          if [ "$REF_TYPE" = tag ] && [[ $REF_NAME == v* ]]; then
            got=$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' bundle-out/telamon-bundle.json)
            if [ "v$got" != "$REF_NAME" ]; then
              echo "::error::the tag is $REF_NAME but the bundle's version is $got: tag v$got"; exit 1
            fi
          fi
          # The artifact is the two files this build made and nothing else.
          if [ "$(find bundle-out -mindepth 1 | wc -l)" != 2 ] || [ "$(find bundle-out -mindepth 1 -type f | wc -l)" != 2 ]; then
            echo "::error::bundle-out must hold the archive and telamon-bundle.json and nothing else"; exit 1
          fi
          {
            echo '### Telamon bundle'
            echo '```'
            (cd bundle-out && sha256sum -- *)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: telamon-bundle
          path: bundle-out/*
          if-no-files-found: error
          retention-days: 14

  sign:
    # Runs none of the app's code, only the framework's own tools fetched by
    # sha: tools/bundle.py verify, then minisign. The key is in the environment
    # of the one step that signs, which parses nothing: the step before it,
    # which parses the bundle, has no secret. A malicious
    # app build can get a *structurally valid* bundle signed (the archive must
    # match its manifest and the layout rules) and nothing else; whoever
    # controls the app's build controls what that bundle contains, which is
    # why an app with several writers signs offline (publish: false).
    needs: bundle
    if: ${{ inputs.attach && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: registry.fedoraproject.org/fedora:44
    # No token at all: the job only downloads this run's artifact and fetches a public repository.
    permissions: {}
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
      manifest-sha256: ${{ steps.verify.outputs.manifest-sha256 }}
    env:
      FRAMEWORK_REF: ${{ inputs.framework-ref }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Tools for the framework fetch, the check and the signature
        run: dnf -y install git-core python3 zstd minisign coreutils findutils

      - name: Check the tag and the framework ref
        run: |
          if ! [[ $TAG =~ ^v[0-9]+(\.[0-9]+)+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::the tag $(printf '%q' "$TAG") is not vX.Y.Z or vX.Y.Z-prerelease (digits, letters, . and -)"; exit 1
          fi
          if ! [[ $FRAMEWORK_REF =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::framework-ref must be the full 40-character commit sha of a telamon-framework release"; exit 1
          fi

      - name: Fetch the framework
        id: framework
        run: |
          # The same fetch as the bundle job: that exact commit, outside the workspace.
          dir="$RUNNER_TEMP/telamon-framework"
          git init -q "$dir"
          git -C "$dir" fetch -q --depth 1 -- https://github.com/EternalCoder454/atlas-framework "$FRAMEWORK_REF"
          git -C "$dir" checkout -q FETCH_HEAD
          if [ "$(git -C "$dir" rev-parse HEAD)" != "$FRAMEWORK_REF" ]; then
            echo "::error::fetched $(git -C "$dir" rev-parse HEAD), not $FRAMEWORK_REF"; exit 1
          fi
          if [ ! -x "$dir/tools/sign-bundle.sh" ]; then
            echo "::error::framework-ref has no tools/sign-bundle.sh: use a commit from 2.0.8 on"; exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: telamon-bundle
          path: bundle-out

      # Step A parses the hostile bundle (python3, zstd, tarfile) and has no
      # secret in its environment (the script refuses to run with one).
      - name: Verify the bundle
        id: verify
        env:
          FRAMEWORK_DIR: ${{ steps.framework.outputs.dir }}
        run: '"$FRAMEWORK_DIR/tools/sign-bundle.sh" --verify-only bundle-out'

      # Step B has the key and parses nothing: it checks that the manifest is
      # the file step A verified and that the directory holds only the bundle,
      # then signs.
      - name: Sign the manifest
        id: sign
        env:
          FRAMEWORK_DIR: ${{ steps.framework.outputs.dir }}
          MANIFEST_SHA256: ${{ steps.verify.outputs.manifest-sha256 }}
          PUBLIC_KEY: ${{ inputs.minisign-public-key }}
          MINISIGN_KEY: ${{ secrets.minisign-key }}
          MINISIGN_PASSWORD: ${{ secrets.minisign-password }}
        run: |
          args=()
          [ -z "$PUBLIC_KEY" ] || args+=(--public-key "$PUBLIC_KEY")
          "$FRAMEWORK_DIR/tools/sign-bundle.sh" --sign-only --manifest-sha256 "$MANIFEST_SHA256" "${args[@]}" bundle-out

      - name: Upload the signature
        if: steps.sign.outputs.signed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: telamon-bundle-signature
          path: bundle-out/telamon-bundle.json.minisig
          if-no-files-found: error
          retention-days: 14

  attach:
    # The only job that can write: it runs nothing but gh, jq and sha256sum, on
    # the files the other jobs uploaded, which it checks against what the sign
    # job verified. A caller must grant `contents: write`.
    needs: [bundle, sign]
    if: ${{ inputs.attach && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      SIGNED: ${{ needs.sign.outputs.signed }}
      MANIFEST_SHA256: ${{ needs.sign.outputs.manifest-sha256 }}
      PUBLISH: ${{ inputs.publish }}
      ALLOW_UNSIGNED: ${{ inputs.allow-unsigned }}
    steps:
      - name: Check the tag
        run: |
          if ! [[ $TAG =~ ^v[0-9]+(\.[0-9]+)+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::the tag $(printf '%q' "$TAG") is not vX.Y.Z or vX.Y.Z-prerelease (digits, letters, . and -)"; exit 1
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: telamon-bundle
          path: bundle-out

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.sign.outputs.signed == 'true'
        with:
          name: telamon-bundle-signature
          path: bundle-out

      # Only the files the sign job saw are attached: the manifest has the hash
      # it verified and signed, the archive has the hash the manifest names, and
      # nothing else is in the directory.
      - name: The files are the ones that were verified
        id: files
        run: |
          [[ $MANIFEST_SHA256 =~ ^[0-9a-f]{64}$ ]] || { echo "::error::the sign job gave no manifest hash"; exit 1; }
          manifest=bundle-out/telamon-bundle.json
          got=$(sha256sum -- "$manifest"); got=${got%% *}
          if [ "$got" != "$MANIFEST_SHA256" ]; then
            echo "::error::telamon-bundle.json is not the file the sign job verified"; exit 1
          fi
          name=$(jq -r .archive.name "$manifest")
          if ! [[ $name =~ ^[A-Za-z0-9._-]+-x86_64\.tar\.zst$ ]]; then
            echo "::error::the manifest names an archive that is not <id>-<version>-x86_64.tar.zst"; exit 1
          fi
          want=$(jq -r .archive.sha256 "$manifest")
          got=$(sha256sum -- "bundle-out/$name"); got=${got%% *}
          if [ "$got" != "$want" ]; then
            echo "::error::$name is not the archive the manifest names"; exit 1
          fi
          expected=("$name" telamon-bundle.json)
          [ "$SIGNED" != true ] || expected+=(telamon-bundle.json.minisig)
          if [ "$(find bundle-out -mindepth 1 -printf '%P\n' | LC_ALL=C sort)" != "$(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)" ] ||
            [ -n "$(find bundle-out -mindepth 1 ! -type f)" ]; then
            echo "::error::bundle-out must hold exactly: ${expected[*]}"; exit 1
          fi
          got=$(jq -r .version "$manifest")
          if [ "v$got" != "$TAG" ]; then
            echo "::error::the tag is $TAG but the bundle's version is $got: tag v$got"; exit 1
          fi
          {
            echo "name=$name"
            echo "signed=$SIGNED"
          } >> "$GITHUB_OUTPUT"

      - name: Attach the bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.files.outputs.name }}
        run: |
          # GitHub sometimes answers 5xx to a release create or an upload: try again.
          # A release made here is a draft until its files are on it, so Store
          # never sees a release without its bundle; one that exists (made by
          # hand, or a draft a failed run left) just gets the assets.
          repo=(--repo "$GITHUB_REPOSITORY")
          assets=("bundle-out/$ARCHIVE" bundle-out/telamon-bundle.json)
          [ "$SIGNED" != true ] || assets+=(bundle-out/telamon-bundle.json.minisig)
          # No signature (the secret is missing, misspelled or not passed to a fork): the release
          # stays a draft, so it cannot go public by mistake. Telamon Store would not offer it.
          keep_draft=0
          [ "$PUBLISH" = true ] || keep_draft=1
          if [ "$SIGNED" != true ]; then
            if [ "$ALLOW_UNSIGNED" = true ]; then
              echo "::warning::$ARCHIVE and telamon-bundle.json are attached WITHOUT telamon-bundle.json.minisig (allow-unsigned): Telamon Store will not offer this release until it is signed (docs/BUNDLES.md, Signing)"
            else
              keep_draft=1
              echo "::error title=Release left as a draft (not signed)::there is no signature, so $TAG stays a DRAFT. Telamon Store will not offer an unsigned release. Sign it offline and publish: gh release download $TAG -p telamon-bundle.json -p '*.tar.zst'; python3 tools/bundle.py verify <archive> telamon-bundle.json; minisign -Sm telamon-bundle.json; gh release upload $TAG telamon-bundle.json.minisig; gh release edit $TAG --draft=false. Or pass the minisign-key secret, or set allow-unsigned to publish it unsigned"
            fi
          fi
          created=0
          if ! gh release view "$TAG" "${repo[@]}" >/dev/null 2>&1; then
            flags=(--verify-tag --title "$TAG" --generate-notes --draft)
            [[ $TAG == *-* ]] && flags+=(--prerelease)
            for attempt in 1 2 3 4 5; do
              if gh release create "$TAG" "${repo[@]}" "${flags[@]}"; then
                created=1; break
              fi
              # A failed create may still have made it (a 5xx after the fact), or
              # another run did: then the release is not ours to remove.
              if gh release view "$TAG" "${repo[@]}" >/dev/null 2>&1; then
                break
              fi
              sleep $((attempt * 5))
            done
          fi
          if ! gh release view "$TAG" "${repo[@]}" >/dev/null 2>&1; then
            echo "::error::could not create the release $TAG"; exit 1
          fi
          draft=$(gh release view "$TAG" "${repo[@]}" --json isDraft --jq .isDraft)
          uploaded=0
          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" "${repo[@]}" --clobber "${assets[@]}"; then
              uploaded=1; break
            fi
            sleep $((attempt * 5))
          done
          if [ "$uploaded" != 1 ]; then
            # Only the draft this run made is removed.
            if [ "$created" = 1 ]; then
              gh release delete "$TAG" "${repo[@]}" --yes || echo "::warning::could not delete the draft release $TAG"
            fi
            echo "::error::could not upload the bundle to $TAG"; exit 1
          fi
          if [ "$created" = 1 ] || [ "$draft" = true ]; then
            if [ "$keep_draft" = 1 ]; then
              [ "$PUBLISH" = true ] || echo "::notice::the release $TAG is a draft (publish is false). To sign it by hand: gh release download $TAG -p telamon-bundle.json -p '*.tar.zst', python3 tools/bundle.py verify <archive> telamon-bundle.json, minisign -Sm telamon-bundle.json, gh release upload $TAG telamon-bundle.json.minisig, gh release edit $TAG --draft=false"
            else
              published=0
              for attempt in 1 2 3 4 5; do
                if gh release edit "$TAG" "${repo[@]}" --draft=false; then
                  published=1; break
                fi
                sleep $((attempt * 5))
              done
              [ "$published" = 1 ] || { echo "::error::the bundle is on the draft release $TAG, but publishing it failed: publish it by hand"; exit 1; }
            fi
          fi
          echo "Attached to $TAG:"; ls -l bundle-out
