name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Atlas.Ui, the crates and the performance check run as three jobs at once,
  # each in the dev container with its own build cache, so a push is checked
  # in about the time of the slowest one instead of the sum.
  ui:
    # Atlas.Ui, the gallery and the tests: build, qmllint, visual, a11y and
    # state tests, and the API snapshot.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # qmllint warnings allowed; lower it when warnings are fixed, never raise it.
      QMLLINT_MAX: 119
      # Every step below runs in the dev container, with the checkout at /src.
      # git runs as root on a checkout the runner user owns: safe.directory lets it.
      RUN: docker run --rm -v ${{ github.workspace }}:/src -w /src -e CCACHE_DIR=/src/.ccache -e CCACHE_BASEDIR=/src -e CCACHE_MAXSIZE=400M -e CARGO_TARGET_DIR=/src/target -e QMAKE=/usr/bin/qmake6 -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/src atlas-framework-dev:ci
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Tags: check-api.sh reads the last v* tag.
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/dev-container
        with:
          # One writer for the shared layer cache: three at once race.
          write-cache: 'true'

      - name: Restore the compiler cache
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .ccache
          # A new entry per commit; the newest one of any commit seeds the next run.
          key: ccache-ui-${{ hashFiles('packaging/Containerfile.dev') }}-${{ github.sha }}
          restore-keys: ccache-ui-${{ hashFiles('packaging/Containerfile.dev') }}-

      - name: Build Atlas.Ui, the gallery, the tests and the API dump
        run: $RUN bash -c 'cmake -S . -B build -G Ninja -DATLAS_UI_TESTS=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache && cmake --build build && ccache --show-stats'

      - name: qmllint
        # Warnings don't fail qmllint itself; more than the budget fails here.
        run: |
          $RUN bash -o pipefail -c 'cmake --build build --target all_qmllint 2>&1 | tee build/qmllint.log'
          n=$(grep -c '^Warning' build/qmllint.log || true)
          echo "qmllint: $n warnings (budget $QMLLINT_MAX)"
          if [ "$n" -gt "$QMLLINT_MAX" ]; then
            echo "::error::qmllint has $n warnings, over the budget of $QMLLINT_MAX: fix the new ones (grep -A2 '^Warning' build/qmllint.log)"
            exit 1
          fi

      - name: Visual tests
        run: $RUN bash -c 'ctest --test-dir build -j "$(nproc)" --output-on-failure'

      - name: Upload the actual and diff pictures of a failed visual test
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-test-output
          path: build/visual-out
          if-no-files-found: ignore

      - name: API check
        run: $RUN tools/check-api.sh build

      # The container writes as root: hand the cache back to the runner user,
      # or saving it fails on files tar cannot read.
      - name: Own the compiler cache
        if: ${{ !cancelled() && github.event_name == 'push' }}
        run: sudo chown -R "$(id -u):$(id -g)" .ccache

      - name: Save the compiler cache
        if: ${{ !cancelled() && github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .ccache
          key: ${{ steps.cache.outputs.cache-primary-key }}

  crates:
    # The Rust crates: tests, clippy and cargo-semver-checks against the last release.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUN: docker run --rm -v ${{ github.workspace }}:/src -v ${{ github.workspace }}/.cargo-registry:/opt/cargo/registry -w /src -e CARGO_TARGET_DIR=/src/target -e QMAKE=/usr/bin/qmake6 -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/src atlas-framework-dev:ci
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Tags and history: cargo-semver-checks builds the last release as its baseline.
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/dev-container

      - name: Restore the cargo cache
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # The downloaded crates, and the compiled dependencies (cargo rebuilds
          # the workspace's own crates, whose sources the checkout made newer).
          path: |
            .cargo-registry
            target
          key: cargo-crates-${{ hashFiles('packaging/Containerfile.dev', '**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: cargo-crates-${{ hashFiles('packaging/Containerfile.dev', '**/Cargo.lock') }}-

      - name: Rust tests
        run: $RUN cargo test --locked --workspace --all-features

      - name: Clippy
        run: $RUN cargo clippy --locked --workspace --all-features --all-targets -- -D warnings

      - name: Baseline for cargo-semver-checks
        id: baseline
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # The latest v* tag before this commit (a tag push compares with the
          # release before it, not with itself); else, for a pull request,
          # where it branched from the target.
          exclude=()
          while read -r t; do
            [ -n "$t" ] && exclude+=(--exclude "$t")
          done < <(git tag --points-at HEAD --list 'v*')
          ref=$(git describe --tags --match 'v*' "${exclude[@]}" --abbrev=0 2>/dev/null || true)
          if [ -z "$ref" ] && [ -n "$BASE_REF" ]; then
            ref=$(git merge-base HEAD "origin/$BASE_REF" || true)
          fi
          if [ -z "$ref" ]; then
            echo "::notice::No v* tag and not a pull request: cargo-semver-checks has no baseline, skipped"
            exit 0
          fi
          git worktree add "$RUNNER_TEMP/baseline" "$ref"
          echo "root=$RUNNER_TEMP/baseline" >> "$GITHUB_OUTPUT"
          echo "Baseline: $ref"

      - name: cargo semver-checks
        if: steps.baseline.outputs.root != ''
        run: docker run --rm -v "${{ github.workspace }}:/src" -v "${{ github.workspace }}/.cargo-registry:/opt/cargo/registry" -v "${{ steps.baseline.outputs.root }}:/baseline:ro" -w /src -e CARGO_TARGET_DIR=/src/target/semver -e QMAKE=/usr/bin/qmake6 atlas-framework-dev:ci cargo semver-checks --workspace --baseline-root /baseline

      - name: Own the cargo cache
        if: ${{ !cancelled() && github.event_name == 'push' }}
        run: sudo chown -R "$(id -u):$(id -g)" .cargo-registry target

      - name: Save the cargo cache
        if: ${{ !cancelled() && github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .cargo-registry
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  perf:
    # The app template on this Atlas.Ui, headless, against perf/budget.json.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Startup time on a shared runner is noisy: over budget it only warns.
      RUN: docker run --rm -v ${{ github.workspace }}:/src -v ${{ github.workspace }}/.cargo-registry:/opt/cargo/registry -w /src -e CCACHE_DIR=/src/.ccache -e CCACHE_BASEDIR=/src -e CCACHE_MAXSIZE=400M -e QMAKE=/usr/bin/qmake6 -e ATLAS_PERF_TEMPLATE_BUILD=/src/.perf-template -e PERF_WARN_ONLY=startup_ms atlas-framework-dev:ci
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/dev-container

      - name: Restore the build caches
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # Atlas.Ui's objects, and the template's build tree with its cargo target.
          path: |
            .ccache
            .cargo-registry
            .perf-template
          key: perf-${{ hashFiles('packaging/Containerfile.dev', 'template/Cargo.lock') }}-${{ github.sha }}
          restore-keys: perf-${{ hashFiles('packaging/Containerfile.dev', 'template/Cargo.lock') }}-

      - name: Build Atlas.Ui
        run: $RUN bash -c 'cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache && cmake --build build'

      - name: Performance
        run: $RUN bash -c 'perf/measure.sh build'

      - name: Show the performance numbers
        if: always()
        run: |
          if [ -f perf/out.json ]; then
            { echo '### Performance (template app, headless)'; echo '```json'; cat perf/out.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the performance numbers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: perf-out
          path: perf/out.json
          if-no-files-found: ignore

      - name: Own the build caches
        if: ${{ !cancelled() && github.event_name == 'push' }}
        run: sudo chown -R "$(id -u):$(id -g)" .ccache .cargo-registry .perf-template

      - name: Save the build caches
        if: ${{ !cancelled() && github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .ccache
            .cargo-registry
            .perf-template
          key: ${{ steps.cache.outputs.cache-primary-key }}

  apps:
    # The Atlas apps against this Atlas.Ui: a type named like one of an app's own
    # files breaks that app (it fails here); rule 6 findings belong to the apps
    # and are only printed.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Clone the apps
        run: |
          mkdir -p "$RUNNER_TEMP/apps"
          while read -r app; do
            [ -z "$app" ] && continue
            git clone --depth 1 "https://github.com/EternalCoder454/$app" "$RUNNER_TEMP/apps/$app"
          done < tools/apps.txt

      - name: Design rule 6 findings (informational)
        # Exit 1 is findings, which belong to the apps; anything else (a
        # missing app, a broken script) fails.
        run: |
          rc=0
          tools/lint-app.sh "$RUNNER_TEMP"/apps/* || rc=$?
          if [ "$rc" = 1 ]; then
            echo "::notice::Rule 6 errors above belong to those apps; they do not fail this check"
          elif [ "$rc" != 0 ]; then
            exit "$rc"
          fi

      - name: Type names against the apps' files
        run: tools/check-app-names.sh "$RUNNER_TEMP"/apps/*

  docs:
    # The reference docs (docs/reference, read by atlasos.eterneon.net/framework):
    # broken links, missing frontmatter, raw HTML and the rest fail here.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check the docs
        run: |
          python3 tools/test_docs.py
          python3 tools/docs.py check

      - name: Design rules in the gallery and the template
        # These are ours, so their findings fail; so does a type name the
        # template's own files would hide.
        run: |
          tools/lint-app.sh ui/gallery template
          tools/check-app-names.sh template

  publish-docs:
    # main, and v* tags that point at main's tip: rebuilds the docs-published
    # branch (the pages, their images and index.json) that the site fetches.
    # The only job that may write. It needs `docs` but not the build jobs on
    # purpose: the docs describe the source, and the build jobs take far longer.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: publish-docs
      # Not cancelled: a tag run on an older commit would cancel the newest
      # main run and then skip itself. GitHub keeps one pending run, and the
      # main-tip guard below skips stale commits.
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Tags: index.json says whether this commit is the release.
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch all tags
        # Runs are serialised by the group, so a main run that follows the tag
        # run sees the tag: `released` does not depend on run order. Public repo, no auth.
        run: git fetch --force --tags origin

      - name: Build the published tree
        run: python3 tools/docs.py build "$RUNNER_TEMP/docs-published"

      - name: Force-push docs-published
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          # Only main's tip is published: a re-run or an out-of-order run of an
          # older commit must not roll the branch back.
          head=$(git rev-parse HEAD)
          tips=$(git -c http.extraheader="AUTHORIZATION: basic $auth" \
            ls-remote --exit-code --heads "https://github.com/$REPO.git" refs/heads/main) || tips=
          if [ -z "$tips" ] || [ "$(printf '%s\n' "$tips" | wc -l)" -ne 1 ]; then
            echo "::error::cannot read main's tip from $REPO"
            exit 1
          fi
          main=${tips%%[[:space:]]*}
          if [ "$main" != "$head" ]; then
            echo "::notice::main is at $main, not $head: not publishing these docs"
            exit 0
          fi
          cd "$RUNNER_TEMP/docs-published" || exit 1
          git init -q -b docs-published
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Docs from $SHA"
          git -c http.extraheader="AUTHORIZATION: basic $auth" \
            push --force "https://github.com/$REPO.git" HEAD:refs/heads/docs-published
