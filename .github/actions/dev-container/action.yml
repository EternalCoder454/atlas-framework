name: Dev container
description: >
  Builds packaging/Containerfile.dev as telamon-framework-dev:ci (layers cached in
  the GitHub Actions cache), for the jobs that build and test in it.
inputs:
  write-cache:
    description: >
      'true' for the one job per run that may write the layer cache (three at
      once race). It still writes only on a push to main: tags and pull requests
      only read, so they cannot fill or poison the cache main uses.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build the dev container
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: packaging
        file: packaging/Containerfile.dev
        load: true
        tags: telamon-framework-dev:ci
        cache-from: type=gha
        # ignore-error: a failed export (quota, an outage) must not fail the build.
        cache-to: ${{ inputs.write-cache == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,mode=max,ignore-error=true' || '' }}
