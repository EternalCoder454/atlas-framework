[package]
name = "telamon-app-template"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.89"
description = "Starting point for Telamon apps: Kirigami + CXX-Qt + telamon-framework"

# The template is not part of the framework workspace; it builds on its own.
[workspace]

[lib]
name = "telamon_app_template"
crate-type = ["staticlib"]

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = "0.10"
log = "0.4"
# The Telamon framework crates. Here they come from this checkout; a copied app
# takes them from git, pinned to a release tag so a change there can't break
# the app or slip into its build unreviewed. Each release opens a pull request
# in every app that moves the tag forward (CHANGELOG.md says what changed):
#   (use the latest release tag, e.g. v1.4.0, in place of vX.Y.Z)
#   telamon-framework-ui = { git = "https://github.com/EternalCoder454/atlas-framework", tag = "vX.Y.Z" }
# Add telamon-framework-system (crash reports, Telamon OS state, polkit,
# notifications) or telamon-framework-flatpak only if the app needs them. The
# `notify` feature is what the demo notification in src/backend.rs uses.
telamon-framework-ui = { path = "../crates/telamon-framework-ui" }
telamon-framework-system = { path = "../crates/telamon-framework-system", features = ["notify"] }

[build-dependencies]
cxx-qt-build = "0.10"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
