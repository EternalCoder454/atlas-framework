[package]
name = "atlas-app-template"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
description = "Starting point for Atlas apps: Kirigami + CXX-Qt + atlas-core"

# The template is not part of the atlas-updater workspace; it builds on its own.
[workspace]

[lib]
name = "atlas_app_template"
crate-type = ["staticlib"]

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = "0.10"
# atlas-core lives in the Atlas Updater repository, pinned to a commit so a
# change there can't break the app, or slip into its build unreviewed. Move
# the rev forward on purpose.
atlas-core = { git = "https://github.com/EternalCoder454/atlasos-updater", rev = "bd4bbaa0413dd1ca14b1bacb11d97797f5240013", package = "atlas-core" }

[build-dependencies]
cxx-qt-build = "0.10"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
