name: Telamon bundle
# Builds the app as a Telamon native bundle and attaches it to the GitHub
# release of a v* tag, where Telamon Store finds it. The tag's version must be
# the CMake project() VERSION. See docs/BUNDLES.md in telamon-framework.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    permissions:
      contents: write
    # Replace <FRAMEWORK_SHA> (twice) with the full 40-character commit sha of
    # the telamon-framework release the app builds against, and vX.Y.Z with its tag.
    uses: EternalCoder454/atlas-framework/.github/workflows/bundle.yml@<FRAMEWORK_SHA> # vX.Y.Z
    with:
      framework-ref: <FRAMEWORK_SHA>
      # Telamon Store offers only releases signed with the key its catalog lists for
      # the app. `publish: false` leaves each release a draft, so you sign
      # telamon-bundle.json on your own computer and publish it (docs/BUNDLES.md,
      # "Signing"): the safest way. Remove it, and pass the key as a secret below, to
      # sign in CI instead; read "What CI signing does not protect" first.
      publish: false
    # secrets:
    #   minisign-key: ${{ secrets.MINISIGN_KEY }}
    #   minisign-password: ${{ secrets.MINISIGN_PASSWORD }}   # only if the key has a password
