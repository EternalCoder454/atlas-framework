name: Security
# The app's dependencies against the RustSec advisory database, and their
# licences and sources (deny.toml), on every change to them and every week: a
# new advisory against an unchanged Cargo.lock shows up without a commit.
on:
  push:
    branches: [main]
    paths: [Cargo.toml, Cargo.lock, deny.toml, .github/workflows/security.yml]
  pull_request:
    paths: [Cargo.toml, Cargo.lock, deny.toml, .github/workflows/security.yml]
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
