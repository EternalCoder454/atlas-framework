name: Telamon checks
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  telamon:
    # Pinned by commit, like the actions below and like bundle.yml: a tag can be
    # moved, a commit cannot. Replace <FRAMEWORK_SHA> (twice) with the full
    # 40-character commit sha of the telamon-framework release that
    # telamon-framework-ui in Cargo.toml is pinned to, and vX.Y.Z with its tag;
    # move all three by hand when the app moves to a newer framework release.
    uses: EternalCoder454/atlas-framework/.github/workflows/app-checks.yml@<FRAMEWORK_SHA> # vX.Y.Z
    with:
      framework-ref: <FRAMEWORK_SHA>

  desktop-file:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install desktop-file-utils
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils
      - name: Validate the desktop file
        run: desktop-file-validate data/*.desktop
